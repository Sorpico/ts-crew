<!doctype html><html><head><meta charset=utf8><meta name="robots" content="noindex,nofollow,noarchive"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Supershoot 2026 Crew Schedule</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link id="pg-fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&amp;family=Source+Sans+3:wght@400;600&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap">
<style>
/* Layout: call-sheet style — slim header band, tab strip, dense working tables */
:root{
  --bg:#f3f4f2; --panel:#ffffff; --ink:#1b2320; --muted:#5b6661; --line:#d9ddd8;
  --accent:#c77a12; --accent-ink:#ffffff; --tint:#eaece8;
  --ok:#1f7a4a; --ok-bg:#dff1e6; --warn:#9a6400; --warn-bg:#fbefd6;
  --bad:#a33a2c; --bad-bg:#f8e1dc; --idle:#55606b; --idle-bg:#e6e9ec;
  --grid:#e7ecea; --sound:#1f7a5a; --off:#c26a12; --mcv:#8a93a6; --other:#c9d3cf; --other-ink:#2b3633; --range:#2f5fa8; --over:#c0392b; --cursor:#c0392b; --lunch:rgba(194,106,18,.08); --fg:var(--ink); --rule:var(--line);
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#131816; --panel:#1b2220; --ink:#e7ebe8; --muted:#9aa5a0; --line:#2e3834;
  --accent:#e59a34; --accent-ink:#1a1206; --tint:#222b28;
  --ok:#7fd3a2; --ok-bg:#18362a; --warn:#f0c26e; --warn-bg:#3a2d12;
  --bad:#f1998b; --bad-bg:#40211c; --idle:#b4bec8; --idle-bg:#262e35; --grid:#222c28; --sound:#2fa77b; --off:#e08a2e; --mcv:#5d6678; --other:#35423d; --other-ink:#d6dfdb; --range:#4c7fd0; --over:#ef5b4b; --cursor:#ef5b4b; --lunch:rgba(224,138,46,.10); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131816; --panel:#1b2220; --ink:#e7ebe8; --muted:#9aa5a0; --line:#2e3834;
  --accent:#e59a34; --accent-ink:#1a1206; --tint:#222b28;
  --ok:#7fd3a2; --ok-bg:#18362a; --warn:#f0c26e; --warn-bg:#3a2d12;
  --bad:#f1998b; --bad-bg:#40211c; --idle:#b4bec8; --idle-bg:#262e35; --grid:#222c28; --sound:#2fa77b; --off:#e08a2e; --mcv:#5d6678; --other:#35423d; --other-ink:#d6dfdb; --range:#4c7fd0; --over:#ef5b4b; --cursor:#ef5b4b; --lunch:rgba(224,138,46,.10); color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
header{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;border-bottom:3px solid var(--accent);padding-bottom:12px}
h1{font-family:var(--f-display);font-weight:700;font-size:2.1rem;letter-spacing:.01em;margin:0;line-height:1;text-wrap:balance}
.sub{color:var(--muted);font-size:.9rem;margin-top:4px}
.po{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);text-align:right}
.po b{color:var(--ink)}
#save{font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}
.counts{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 4px}
.count{display:flex;align-items:baseline;gap:6px;padding:6px 10px;border-radius:4px;font-size:.85rem}
.count b{font-family:var(--f-display);font-size:1.35rem;font-variant-numeric:tabular-nums}
nav{display:flex;gap:2px;margin:18px 0 0;border-bottom:1px solid var(--line);overflow-x:auto}
nav button{font-family:var(--f-display);font-size:1.05rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);padding:8px 14px;cursor:pointer;white-space:nowrap}
nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}@media (max-width:520px){nav button{flex:1 1 auto;padding:8px 4px;font-size:.8rem;letter-spacing:.02em}}
nav button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
section{padding-top:18px}
h2{font-family:var(--f-display);font-weight:600;font-size:1.3rem;margin:22px 0 8px;letter-spacing:.02em}
h2:first-child{margin-top:0}
.lst{margin:0 0 10px;padding-left:20px;max-width:70ch}.lst li{margin:4px 0;line-height:1.4}.note{color:var(--muted);font-size:.88rem;max-width:70ch;margin:0 0 10px}
.tbl{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th{font-family:var(--f-display);font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:.78rem;color:var(--muted);text-align:left;padding:8px 10px;background:var(--tint);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--f-mono)}
.mono{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);word-break:break-all}
.name{font-weight:600;white-space:nowrap}
.prev{font-size:.8rem;color:var(--muted)}
select,input[type=text],textarea{font:inherit;font-size:.88rem;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:4px 6px;max-width:100%}
textarea{width:100%;min-width:160px;resize:vertical;min-height:30px}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent)}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:.78rem;font-weight:600;white-space:nowrap}
.s-Locked{background:var(--ok-bg);color:var(--ok)}
.s-Checking,.s-Asked{background:var(--warn-bg);color:var(--warn)}
.s-Out{background:var(--bad-bg);color:var(--bad)}
.s-Not\ asked{background:var(--idle-bg);color:var(--idle)}
select.status{font-weight:600;border-radius:999px;padding:2px 6px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.grid2>*{min-width:0}
.short{color:var(--bad);font-weight:600}
.okc{color:var(--ok);font-weight:600}
.day{display:grid;grid-template-columns:120px 1fr;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.day:last-child{border-bottom:0}
.day .d{font-family:var(--f-display);font-weight:700;font-size:1.15rem;line-height:1.1}
.day .d span{display:block;font-family:var(--f-mono);font-weight:400;font-size:.75rem;color:var(--muted)}
.day .k{display:inline-block;font-family:var(--f-display);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:.78rem;color:var(--accent);margin-bottom:2px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px}
.todo{display:flex;gap:10px;align-items:flex-start;padding:8px 12px;border-bottom:1px solid var(--line)}
.todo:last-child{border-bottom:0}
.todo.done span{color:var(--muted);text-decoration:line-through}
.btn{font:inherit;font-size:.85rem;font-weight:600;background:var(--accent);color:var(--accent-ink);border:0;border-radius:4px;padding:6px 12px;cursor:pointer}
.addrow{display:flex;gap:8px;flex-wrap:wrap;padding:10px 12px;border-top:1px solid var(--line)}
.addrow input{flex:1;min-width:0}

/* Timeline (merged from the Overlap Board) */
.tl{display:flex;flex-direction:column;gap:14px}
.tl-bar{display:flex;flex-wrap:wrap;gap:8px}
.tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:3px}
.tabs button{font:600 .95rem var(--f-display);letter-spacing:.04em;text-transform:uppercase;border:0;background:transparent;color:var(--muted);padding:7px 12px;border-radius:6px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--fg);color:var(--bg)}
.tabs button:focus-visible,.lane-bar:focus-visible{outline:2px solid var(--cursor);outline-offset:2px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.82rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:10px;border-radius:2px;display:inline-block;flex:none}
.tl-board{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:16px;align-items:start}
@media (max-width:900px){.tl-board{grid-template-columns:minmax(0,1fr)}}
.scroller{overflow-x:auto;background:var(--panel);border:1px solid var(--rule);border-radius:10px;min-width:0}
.chart{position:relative;min-width:980px;user-select:none}
.tl-row{display:grid;grid-template-columns:170px 1fr}
.tl-row .lab{font-size:.8rem;padding:0 10px;display:flex;align-items:center;border-right:1px solid var(--rule);background:var(--panel);position:sticky;left:0;z-index:3;min-width:0}
.tl-row .lab b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-row .track{position:relative;height:34px;border-bottom:1px solid var(--grid)}
.tl-row.grp .lab,.tl-row.grp .track{height:26px;background:var(--bg)}
.tl-row.grp .lab{font:600 .72rem var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tl-row.axis .track{height:28px}
.tl-row.tall .track,.tl-row.tall .lab{height:44px}
.tl-row.cnt .track{height:64px}
.tick{position:absolute;top:0;bottom:0;border-left:1px solid var(--grid)}
.tick span{position:absolute;top:6px;left:4px;font:400 .7rem var(--f-mono);color:var(--muted)}
.lane-bar{position:absolute;top:4px;bottom:4px;border-radius:4px;font-size:.72rem;line-height:1.1;padding:3px 6px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer;display:flex;align-items:center}
.lane-bar.dim{opacity:.28}
.c-sound{background:var(--sound);color:#fff}
.c-offsite{background:var(--off);color:#fff}
.c-mcv{background:var(--mcv);color:#fff}
.c-other{background:var(--other);color:var(--other-ink)}
.c-range{background:var(--range);color:#fff}
.c-prep{background:transparent;color:var(--fg);border:1.5px dashed var(--muted)}
.c-comms{background:transparent;color:var(--muted);border:1.5px dotted var(--rule)}
.c-a2{background:color-mix(in srgb,var(--range) 14%,var(--panel));color:var(--fg);border:1px solid color-mix(in srgb,var(--range) 45%,transparent)}
.c-unc{background:var(--over);color:#fff}
.c-lunch{background:var(--lunch);color:var(--off);border:1px dashed color-mix(in srgb,var(--off) 55%,transparent)}
.c-relief{background:color-mix(in srgb,var(--over) 12%,var(--panel));color:var(--over);border:1.5px dashed var(--over)}
.tl-row.xneed .lab{background:color-mix(in srgb,var(--over) 8%,var(--panel))}
.tl-row.grp.xneed .lab,.tl-row.grp.xneed .track{background:color-mix(in srgb,var(--over) 10%,var(--bg));color:var(--over)}
.c-hs{background:color-mix(in srgb,var(--range) 22%,var(--panel));color:var(--fg);border:1px solid color-mix(in srgb,var(--range) 60%,transparent)}
.c-hs-off{background:color-mix(in srgb,var(--off) 22%,var(--panel));color:var(--fg);border:1px dashed var(--off)}
.tl-row.hs .lab{background:color-mix(in srgb,var(--range) 6%,var(--panel))}
.cbar{position:absolute;bottom:4px;border-radius:2px 2px 0 0;background:var(--sound)}
.cbar.over{background:var(--over)}
.cnum{position:absolute;font:600 .66rem var(--f-mono);color:var(--muted);text-align:center}
.cap{position:absolute;left:0;right:0;border-top:1.5px dashed var(--fg);opacity:.55}
.cap span{position:absolute;left:6px;top:-16px;font:600 .66rem var(--f-mono);color:var(--fg);background:var(--panel);padding:0 4px}
.band{position:absolute;top:0;bottom:0;background:var(--lunch);pointer-events:none}
.band span{position:absolute;left:4px;font:600 .64rem var(--f-mono);color:var(--off);letter-spacing:.04em}
.cursor{position:absolute;top:0;bottom:0;width:2px;background:var(--cursor);pointer-events:none;z-index:2}
.cursor span{position:absolute;top:2px;left:4px;font:600 .7rem var(--f-mono);color:var(--panel);background:var(--cursor);padding:1px 4px;border-radius:3px}
.tl-aside{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;position:sticky;top:max(12px,env(safe-area-inset-top,0px))}
.tl-aside h2{margin:0;font-size:1.4rem;display:flex;align-items:baseline;gap:10px}
.tl-aside h2 .t{font-family:var(--f-mono);font-size:1.05rem}
.verdict{font:600 .78rem var(--f-display);letter-spacing:.08em;text-transform:uppercase;padding:4px 8px;border-radius:4px;align-self:flex-start}
.verdict.ok{background:var(--ok-bg);color:var(--ok)}
.verdict.over{background:var(--bad-bg);color:var(--bad)}
.live{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.live li{display:grid;grid-template-columns:10px minmax(0,1fr);gap:8px;font-size:.85rem}
.live li .sw{width:10px;height:10px;margin-top:4px}
.live small{display:block;color:var(--muted);font-size:.76rem}
.hint{color:var(--muted);font-size:.8rem;margin:0}
.bnotes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.bnote{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:12px 14px;font-size:.88rem;min-width:0}
.bnote h3{font:700 .85rem var(--f-display);letter-spacing:.08em;text-transform:uppercase;margin:0 0 6px;color:var(--muted)}
.bnote p{margin:0}
.tab-num{font-variant-numeric:tabular-nums}
.cam-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:12px}
.cam-stats div{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.cam-stats b{font-family:var(--f-display);font-size:1.6rem;line-height:1}
.cam-stats span{font-size:.8rem;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.lane-bar{transition:opacity .15s}}
@media (max-width:560px){.day{grid-template-columns:1fr}.po{text-align:left}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}


/* Crew timeline (phone-first) */
[hidden]{display:none!important}
.mtl{display:flex;flex-direction:column;gap:10px}
.mt-ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.mt-ctl2{gap:6px 12px}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:3px;gap:2px}
.seg button{font:600 .9rem var(--f-display);letter-spacing:.04em;text-transform:uppercase;border:0;background:transparent;color:var(--muted);padding:8px 12px;border-radius:6px;cursor:pointer;min-height:40px;line-height:1}
.seg button small{font:400 .72rem var(--f-mono);letter-spacing:0;text-transform:none;opacity:.8;margin-left:4px}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.zoom button{min-width:44px;font-size:1.05rem}
.zoom button[data-z="fit"]{font-size:.85rem}
.me{display:inline-flex;align-items:center;gap:6px;font-size:.85rem;color:var(--muted)}
.me select{min-height:40px;font-size:.95rem;font-weight:600}
.lnk{font:600 .85rem var(--f-display);letter-spacing:.05em;text-transform:uppercase;background:none;border:0;color:var(--accent);padding:8px 4px;cursor:pointer;min-height:40px}
.lnk.now{color:var(--cursor)}
.seg button:focus-visible,.lnk:focus-visible,.ml:focus-visible,.mb:focus-visible,.me select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mt-legend{font-size:.8rem}
.mt-sc{overflow:auto;max-height:72vh;max-height:72dvh;background:var(--panel);border:1px solid var(--rule);border-radius:10px;touch-action:pan-x pan-y;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;position:relative}
.mt-chart{--pph:84;--lw:104px;position:relative;width:calc(var(--lw) + 13 * var(--pph) * 1px);user-select:none;-webkit-user-select:none}
.mr{display:flex;min-height:46px}.solo .ml{display:none}
.ml{position:sticky;left:0;z-index:3;flex:none;width:var(--lw);box-sizing:border-box;background:var(--panel);border:0;border-right:1px solid var(--rule);border-bottom:1px solid var(--grid);padding:4px 22px 4px 10px;text-align:left;font:inherit;color:var(--ink);display:flex;flex-direction:column;justify-content:center;cursor:pointer;position:sticky}
button.ml{appearance:none}
.ml-n{font-weight:600;font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.15}
.ml small{font-size:.7rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{position:absolute;right:8px;top:50%;width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:translateY(-70%) rotate(45deg);transition:transform .15s}
.ml[aria-expanded="true"] .chev{transform:translateY(-30%) rotate(-135deg)}
.mt{position:relative;flex:none;width:calc(13 * var(--pph) * 1px);border-bottom:1px solid var(--grid);background-image:repeating-linear-gradient(to right,var(--grid) 0 1px,transparent 1px calc(var(--pph) * 1px))}
.mr-ax{position:sticky;top:0;z-index:5;min-height:30px}
.mr-ax .ml{z-index:6;cursor:default;font:600 .7rem var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--rule)}
.mr-ax .mt{background:var(--panel);background-image:none;border-bottom:1px solid var(--rule)}
.tk{position:absolute;top:0;bottom:0;left:calc((var(--s) - 360) / 60 * var(--pph) * 1px);border-left:1px solid var(--rule)}
.tk span{position:absolute;top:8px;left:4px;font:600 .7rem var(--f-mono);color:var(--ink);white-space:nowrap}
.tk-hh,.tk-q{border-left-color:var(--grid);display:none}
.tk-hh span,.tk-q span{color:var(--muted);font-weight:400}
.z-hh .tk-hh,.z-q .tk-q{display:block}
.tk span b,.tk span i{font:inherit;font-style:normal}
.z-lo .tk span i{display:none}
.mr-g{min-height:24px}
.mr-g .ml{font:600 .68rem var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);background:var(--bg);cursor:default;padding:0 10px}
.mr-g .mt{background:var(--bg);background-image:none}
.mr.is-me .ml{box-shadow:inset 4px 0 0 var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--panel))}
.mr.is-me .mt{background-color:color-mix(in srgb,var(--accent) 5%,transparent)}
.mr.is-unc .ml-n{color:var(--over)}
.mb{position:absolute;top:5px;bottom:5px;left:calc((var(--s) - 360) / 60 * var(--pph) * 1px + 1px);width:calc(var(--d) / 60 * var(--pph) * 1px - 2px);min-width:6px;border-radius:4px;font:inherit;font-size:.74rem;line-height:1.1;padding:0 6px;overflow:hidden;cursor:pointer;display:flex;align-items:center;text-align:left}
.mb span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;min-width:0}
.mb.c-prep,.mb.c-comms{border-width:1.5px}
.mb.dim{opacity:.5}
.md{position:sticky;left:0;z-index:4;width:var(--vw,100%);box-sizing:border-box;background:var(--tint);border-bottom:1px solid var(--rule)}
.md-in{padding:6px 10px 8px}
.md-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.md-list li{display:grid;grid-template-columns:10px 92px minmax(0,1fr);gap:8px;align-items:baseline;padding:7px 2px;border-bottom:1px solid var(--line);cursor:pointer;font-size:.86rem}
.md-list li:last-child{border-bottom:0}
.md-list .sw{width:10px;height:10px;align-self:center}
.md-t{font:600 .78rem var(--f-mono);font-variant-numeric:tabular-nums}
.md-n b{font-weight:600}
.md-n small{display:block;color:var(--muted);font-size:.78rem}

function wire(){

  sc.addEventListener('touchmove',function(e){if(pinch&&e.touches.length===2){e.preventDefault();var a=e.touches[0],b=e.touches[1];var d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);applyZoom(pinch.p*d/pinch.d,pinch.fx);}},{passive:false});
  sc.addEventListener('touchend',function(e){if(e.touches.length<2&&pinch){pinch=null;save();}});
  ['gesturestart','gesturechange'].forEach(function(t){sc.addEventListener(t,function(e){e.preventDefault();});});
  sc.addEventListener('wheel',function(e){if(!e.ctrlKey&&!e.metaKey)return;e.preventDefault();var r=sc.getBoundingClientRect();applyZoom(st.pph*Math.exp(-e.deltaY*0.01),e.clientX-r.left);save();},{passive:false});

    var tr=e.target.closest('.mt');if(tr){var rc=tr.getBoundingClientRect();setCur(T0+(e.clientX-rc.left)/st.pph*60);}
  });

  var nb=el.querySelector('[data-now]');if(nb)nb.addEventListener('click',function(){setCur(nowMin());scrollTo(st.cur);});
  el.querySelector('#mt-sheet').addEventListener('click',function(e){if(e.target.closest('[data-close]'))e.currentTarget.hidden=true;});
}

function myday(){
 var M1=Board.model(CREW,'d1'),M2=Board.model(CREW,'d2');var who=M1.who;
 var opts='<option value="">Choose your name…</option>'+M1.crew.map(function(c){return '<option value="'+c.id+'"'+(c.id===me?' selected':'')+'>'+esc(c.name)+'</option>';}).join('');
 var h='<div class="md-pick"><label for="md-sel">Who are you?</label><select id="md-sel">'+opts+'</select></div>';
 var c=M1.crew.filter(function(x){return x.id===me;})[0];
 if(!c)return h+'<p class="note">Pick your name to see your Monday and Tuesday, where to be, and your Monday route map. Your phone remembers it next time.</p>';
 var f=function(m){var hh=Math.floor(m/60),mm=m%60;return (hh>12?hh-12:hh)+':'+String(mm).padStart(2,'0');};
 var K={sound:'Set',range:'Range',prep:'Prep',lunch:'Lunch',a2:'A2',comms:'Comms',offsite:'Set'};
 var day=function(lbl,L,dd){
  var rows=L.filter(function(x){return !/^Fallback/.test(x.n);}).sort(function(a,b){return a.s-b.s||a.e-b.e;}).map(function(x){
   var parts=x.n.split(' @ ');var what=parts[0],where=parts[1]||'';
   return '<tr class="md-'+x.c+'"><td class="md-t">'+f(x.s)+'–'+f(x.e)+'</td><td><div class="md-w">'+esc(what)+'</div>'+(where?'<div class="md-loc">📍 '+esc(where)+'</div>':'')+(x.w&&x.w.length&&!x.fixed?(rfHtml(x.w)||'<div class="md-tal">'+esc(who(x.w).join(', '))+'</div>'):'')+(/^(prep|lunch|comms|a2)$/.test(x.c)?'':prodHtml(dd,x.s,x.e,x.n))+'<div class="md-k">'+(K[x.c]||x.c)+'</div></td></tr>';
  }).join('');
  return '<h2>'+lbl+'</h2>'+(rows?'<table class="md-tb">'+rows+'</table>':'<p class="note">Nothing scheduled.</p>');
 };
 if(MAPS[c.id])h+='<h2>My route <small class="mr-d">Monday</small></h2><img class="md-map" src="maps/'+c.id+'-mon.jpg?v=3" alt="Monday route map for '+esc(c.name)+'"><p class="note">Solid line follows the red cart routes; dashed is the last bit in to the spot. Markers sit on the hole number.</p>';
 if(c.id==='freddie')h+='<h2>Kit tuning: before and after the range break</h2>'+kitTune();
 var U=UNITRF[c.id];if(U)h+='<p class="md-rf">Your field channels ('+U[0]+'): <b class="gc">'+U[1]+'</b> · '+U[2]+' MHz. Talent TX are listed under each set (same both days).</p>';
 h+='<p class="note"><b>'+esc(c.name)+'</b> · '+esc(c.role)+'. Monday call 6:15 AM at the production tent; Tuesday 6:00–6:15 AM. Locations from TaylorMade\u2019s schedule (Monday final; Tuesday from their Day 2 tab). Link straight to this page: <b>schedule.theorysound.com/#me='+c.id+'</b></p>';
 h+=day('Monday, Nov 23',M1.lanes[c.id]||[],'d1');
 h+=day('Tuesday, Nov 24',M2.lanes[c.id]||[],'d2');
 return h;
}

 var h='<header><div><h1>TaylorMade Supershoot 2026 · Sound Crew</h1><div class="sub">Theory Sound for Scratch Media · Apogee Club<span class="addr">, 2103 SW Bridge Rd, Hobe Sound/Indiantown FL</span> · Mon Nov 23 – Tue Nov 24</div></div><div class="po">Updated Nov 22, 11:45 PM</div></header>';
 h+='<nav role="tablist">'+[['myday','My Day'],['timeline','Timeline'],['talent','Talent'],['mics','Micing'],['sound','Sound'],['comms','Comms'],['cams','Cameras'],['notes','Notes'],['schedule','Schedule']].map(function(t){var sh={Schedule:'Sched',Timeline:'Time',Cameras:'Cams'}[t[1]];return '<button role="tab" data-tab="'+t[0]+'" aria-selected="'+(tab===t[0])+'">'+(sh?'<span class="tl-l">'+t[1]+'</span><span class="tl-s">'+sh+'</span>':t[1])+'</button>';}).join('')+'</nav>';
 h+='<section>'+(tab==='myday'?myday():tab==='cams'?cams():tab==='sound'?sound():tab==='comms'?comms():tab==='schedule'?schedule():tab==='mics'?mics():tab==='talent'?talent():tab==='notes'?notesTab():'<div id="tl-root"></div><div id="prod-flow"></div>')+'</section>';
 document.getElementById('app').innerHTML=h;
 document.body.classList.toggle('pt',tab==='talent');

 hhRestore();
 if(tab==='timeline'){MTL.mount(document.getElementById('tl-root'),CREW);var pfl=document.getElementById('prod-flow');if(pfl)pfl.innerHTML=prodFlow();}
 var sel=document.getElementById('md-sel');if(sel)sel.addEventListener('change',function(){me=sel.value;try{localStorage.setItem('tm26me',me);}catch(x){}render();});
}
document.addEventListener('click',function(e){var m=e.target.closest('[data-micday]');if(m){micDay=m.dataset.micday;try{localStorage.setItem('tm26micday',micDay);}catch(x){}render();return;}var b=e.target.closest('[data-tab]');if(!b)return;tab=b.dataset.tab;try{localStorage.setItem('tm26crewtab',tab);}catch(x){}render();});
render();
setInterval(function(){if(tab==='mics'&&micToday())render();},60000);
})();
